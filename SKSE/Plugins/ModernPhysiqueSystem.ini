[Logging]
; Stable default. Use info/debug/trace only for short diagnostic runs.
Level=warn

[Diagnostics]
; Deep causal tracing is expensive. Keep disabled for normal play.
FaceCausalTrace=0
FaceNodeSnapshot=0
RaceMenuEntryDump=0
VerboseLogging=0

[NormalMaps]
; Legacy preserves the currently deployed selection policy exactly.
; Stable uses one geometric search across base, axes, and available combinations.
SelectionMode=legacy
; Stable mode only: keep the current DDS until another sample is this many
; percentage points closer. This reduces boundary chatter.
StableHysteresisPercent=3
