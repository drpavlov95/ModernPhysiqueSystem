<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Rley Body Morphs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="overlay-shell">
        <div class="container">
            <div class="panel-tools">
                <button id="reset" class="ghost-button">Reset</button>
                <label class="snap-toggle">
                    <input id="snapToggle" type="checkbox" checked>
                    <span>Snap</span>
                </label>
            </div>
            <canvas id="morphCanvas" width="400" height="400"></canvas>

            <div class="readout">
                <div>Thin <span id="thinValue">0.00</span></div>
                <div>Muscular <span id="muscularValue">0.00</span></div>
                <div>Heavy <span id="fatValue">0.00</span></div>
            </div>

            <div class="face-controls">
                <label>Remove Facial Morph <input id="removeFaceMorph" type="range" min="0" max="100" value="0"><span id="removeFaceMorphValue">0%</span></label>
                <label>Double Chin <input id="doubleChin" type="range" min="0" max="100" value="0"><span id="doubleChinValue">0%</span></label>
                <label>Fuller Chin <input id="fullerChin" type="range" min="0" max="100" value="0"><span id="fullerChinValue">0%</span></label>
                <label>Independent Thin <input id="standaloneThin" type="range" min="0" max="100" value="0"><span id="standaloneThinValue">0%</span></label>
                <label>Independent Muscular <input id="standaloneMuscular" type="range" min="0" max="100" value="0"><span id="standaloneMuscularValue">0%</span></label>
                <label>Independent Heavy <input id="standaloneHeavy" type="range" min="0" max="100" value="0"><span id="standaloneHeavyValue">0%</span></label>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
