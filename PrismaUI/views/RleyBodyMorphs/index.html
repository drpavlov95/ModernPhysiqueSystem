<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Rley Body Morphs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Body Morphs</h1>

        <canvas id="morphCanvas" width="420" height="420"></canvas>

        <div class="readout">
            <div>Thin: <span id="thinValue">0.00</span></div>
            <div>Muscular: <span id="muscularValue">0.00</span></div>
            <div>Fat: <span id="fatValue">0.00</span></div>
        </div>

        <button id="reset">Reset</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
