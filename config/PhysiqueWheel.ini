[Logging]
; Release default. Use info/debug/trace only for short diagnostic runs.
Level=warn

[Diagnostics]
; Deep causal tracing is expensive. It includes the RaceMenu menu/rebuild
; sequence timeline used by the SWF-removal investigation. Keep disabled for
; normal play.
FaceCausalTrace=0
FaceNodeSnapshot=0
RaceMenuEntryDump=0
VerboseLogging=0

[FaceMorphs]
; shared reads Data\SKSE\Plugins\MPF\morphs (TRI + TOML) directly and applies
; RLY_* deltas to the player's live face buffers. It does not load MPF.dll.
; Use racemenu only as a compatibility fallback for old asset installations.
Backend=shared
; Live RaceMenu preview remains available when Backend=racemenu.
PreviewRaceMenuFaceSliders=1
; When disabled, RaceMenu's native Weight no longer drives the PW morph amount.
; The PW target remains independent; set to 1 only for legacy behavior.
WeightMorphLink=0

[NormalMaps]
; Mu is optional. Auto uses its runtime API when MuDynamicNormalMap.dll is
; present and otherwise leaves normal-map ownership untouched.
; Use none to disable this integration explicitly, or mu to request it
; explicitly (missing Mu only produces a warning).
Backend=auto
; Generate Mu normals continuously while dragging. Set to 0 to update only
; when the wheel interaction is committed.
RealtimePreview=1
